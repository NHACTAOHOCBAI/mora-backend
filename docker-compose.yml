version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mora-postgres
    environment:
      POSTGRES_DB: mora_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data:
